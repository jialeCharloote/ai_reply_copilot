[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-reply-copilot"
version = "0.0.1"
description = "Charla — Mac desktop reply copilot: iMessage/Slack context reader and reply generator (MVP prototype)"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Charlotte" }]
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
charla = "ai_reply_copilot.cli:main"

[tool.setuptools]
packages = ["ai_reply_copilot"]
